services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: predia-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-predia}
      POSTGRES_USER: ${DB_USER:-predia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-predia}
    ports:
      # 5434 en el host para no chocar con otros PostgreSQL locales (5432/5433)
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - predia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-predia} -d ${DB_NAME:-predia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: predia-mailpit
    ports:
      - "127.0.0.1:${MAIL_PORT:-1026}:1025"   # SMTP
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"   # Interfaz web: http://localhost:8026

  # Antivirus opcional (perfil «escaneo»): docker compose --profile escaneo up -d
  # Luego arrancar la API con ESCANEO_MODO=CLAMAV. Tarda unos minutos en cargar las firmas la primera vez.
  clamav:
    image: clamav/clamav-debian:1.4
    container_name: predia-clamav
    profiles: ["escaneo"]
    ports:
      - "127.0.0.1:${CLAMAV_PUERTO:-3310}:3310"
    volumes:
      - predia-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  predia-pgdata:
  predia-clamav:
