# Perfil de pruebas: nunca llama a OpenAI ni siembra la demo. La base la levanta Testcontainers.
spring:
  ai:
    # Las pruebas no deben depender del .env de quien las corre: siempre OpenAI y sin clave (modo manual), aunque el
    # .env diga PREDIA_IA_PROVEEDOR=ollama.
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: sin-configurar
predia:
  jwt:
    secreto: secreto-solo-para-pruebas-automatizadas-0123456789
    horas-validez: 1
  demo:
    habilitada: false
  expedientes:
    # Las pruebas procesan la cola a mano (procesarPendientes): el procesador programado no debe competir con ellas.
    intervalo-indexacion-ms: 3600000
    espera-inicial-indexacion-ms: 3600000
